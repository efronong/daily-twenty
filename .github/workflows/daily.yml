name: Build The Daily Twenty

on:
  schedule:
    - cron: "0 22 * * *"                # 6:00 AM Malaysia time (morning edition)
    - cron: "0 1,4,7,10,13,16 * * *"    # 9 AM, 12 PM, 3 PM, 6 PM, 9 PM, midnight
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the latest stories and build the page
        id: build
        run: |
          dir=$(dirname "$(git ls-files '*build.py' | head -n1)")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          cd "$dir" && python build.py

      - name: Save the morning story list (keeps the schedule switched on)
        if: github.event.schedule == '0 22 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.build.outputs.dir }}/data/latest.json"
          git diff --cached --quiet || git commit -m "Edition $(date -u +%Y-%m-%d)"
          git push || echo "Could not save the story list; the page still publishes."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.build.outputs.dir }}/site

      - id: deployment
        uses: actions/deploy-pages@v5
